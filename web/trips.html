<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Trips – Travel Tracker</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="container">
    <div class="page-header">
      <h1 class="page-title">My Trips</h1>
      <a href="/trip-form.html" class="btn btn-primary">+ New Trip</a>
    </div>
    <div id="content"><div class="loading">Loading trips...</div></div>
  </div>
  <script type="module">
    import { apiJson } from '/js/api.js';
    import { requireAuth, renderNav } from '/js/auth.js';
    import { formatDateRange, statusBadge, emptyState, escapeHtml } from '/js/utils.js';

    if (!requireAuth()) throw new Error('redirect');
    renderNav('trips');

    async function load() {
      try {
        const data = await apiJson('/trips/grouped');
        const content = document.getElementById('content');

        if (!data.upcoming?.length && !data.past?.length) {
          content.innerHTML = emptyState('🌍', 'No trips yet. Create your first trip!');
          return;
        }

        let html = '';
        if (data.upcoming?.length) {
          html += `<h2 class="section-title">Upcoming</h2><div class="card-grid">${data.upcoming.map(tripCard).join('')}</div>`;
        }
        if (data.past?.length) {
          html += `<h2 class="section-title">Past</h2><div class="card-grid">${data.past.map(tripCard).join('')}</div>`;
        }
        content.innerHTML = html;

        content.querySelectorAll('.card-clickable').forEach(c => {
          c.addEventListener('click', () => {
            window.location.href = `/trip-dashboard.html?id=${c.dataset.id}`;
          });
        });
      } catch (err) {
        document.getElementById('content').innerHTML = `<div class="alert alert-danger">${err.message}</div>`;
      }
    }

    function tripCard(trip) {
      return `
        <div class="card card-clickable" data-id="${trip.id}">
          <div class="card-header">
            <span class="card-title">${escapeHtml(trip.title)}</span>
            ${statusBadge(trip.status)}
          </div>
          <div style="color:var(--gray-500);font-size:.875rem">
            ${trip.destination ? `📍 ${escapeHtml(trip.destination)}` : ''}
          </div>
          <div style="color:var(--gray-500);font-size:.875rem;margin-top:.25rem">
            📅 ${formatDateRange(trip.startDate, trip.endDate)}
          </div>
          ${trip.tripType ? `<div style="margin-top:.5rem"><span class="badge badge-gray">${escapeHtml(trip.tripType)}</span></div>` : ''}
        </div>
      `;
    }

    load();
  </script>
</body>
</html>
