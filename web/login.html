<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login – Travel Tracker</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-page">
  <div class="auth-card">
    <h1 class="auth-title">✈ Travel Tracker</h1>
    <p class="auth-subtitle">Sign in to your account</p>
    <div id="error"></div>
    <form id="login-form">
      <div class="form-group">
        <label class="form-label" for="email">Email</label>
        <input class="form-input" type="email" id="email" required autocomplete="email">
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input class="form-input" type="password" id="password" required autocomplete="current-password">
      </div>
      <button class="btn btn-primary btn-block" type="submit" id="submit-btn">Sign In</button>
    </form>
    <p style="text-align:center;margin-top:1rem;font-size:.875rem">
      Don't have an account? <a href="/register.html">Register</a>
    </p>
  </div>
  <script type="module">
    import { apiJson, setTokens, setUser, getToken } from '/js/api.js';
    import { showAlert } from '/js/utils.js';

    if (getToken()) window.location.href = '/trips.html';

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      btn.disabled = true;
      btn.textContent = 'Signing in...';
      try {
        const data = await apiJson('/auth/login', {
          method: 'POST',
          body: JSON.stringify({
            email: document.getElementById('email').value,
            password: document.getElementById('password').value,
          }),
        });
        setTokens(data.accessToken, data.refreshToken);
        setUser(data.user);
        window.location.href = '/trips.html';
      } catch (err) {
        showAlert(document.getElementById('error'), err.message);
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    });
  </script>
</body>
</html>
